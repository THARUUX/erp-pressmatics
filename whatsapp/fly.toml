# fly.toml file for Pressmatics WhatsApp Microservice

app = "pressmatics-whatsapp"
primary_region = "sin" # Singapore region (close to your TiDB Cloud database)

[build]

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = false # Keep running 24/7 to receive real-time WhatsApp messages
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256 # Baileys is lightweight and runs comfortably under 256MB
